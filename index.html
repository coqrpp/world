    function generarPopupHTML(business) { 
      const websiteUrl = business.website || (business.whatsapp ? `https://wa.me/${business.whatsapp.replace(/[^0-9]/g, '')}` : '#');
      let contactButtons = '';
      if(business.website) contactButtons += `<a href="${business.website}" target="_blank" class="contact-link"><i class="fas fa-globe"></i> Web</a>`;
      if(business.whatsapp) contactButtons += `<a href="https://wa.me/${business.whatsapp.replace(/[^0-9]/g, '')}" target="_blank" class="contact-link"><i class="fab fa-whatsapp"></i> WhatsApp</a>`;
      if(business.phone) contactButtons += `<a href="tel:${business.phone}" class="contact-link"><i class="fas fa-phone"></i> Call</a>`;
      if(business.email) contactButtons += `<a href="mailto:${business.email}" class="contact-link"><i class="fas fa-envelope"></i> Email</a>`;
      return `<div class="popup-business-card"><div class="popup-business-header"><h3>⚡ ${business.name}</h3><span class="popup-business-category">${business.category}</span></div><div class="popup-business-info"><div class="popup-business-description">${business.description}</div><div class="popup-business-address"><i class="fas fa-map-pin"></i> ${business.address}</div><div class="popup-business-contact">${contactButtons}</div><a href="${websiteUrl}" target="_blank" class="btn-view-store"><i class="fas fa-store"></i> VIEW STORE</a></div></div>`; 
    }
    
    function initMap() { 
      // CAPA MAPA: SOLO OpenStreetMap
      const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
        maxZoom: 19
      });
      
      mapa = L.map('mapa', { 
        center: [20, 0], 
        zoom: 2, 
        zoomControl: false,
        fadeAnimation: true,
        zoomAnimation: true,
        maxZoom: 19,
        minZoom: 2
      });
      
      currentLayer = osmLayer;
      currentLayer.addTo(mapa);
      
      // Clusters
      let clusters = L.markerClusterGroup({ 
        iconCreateFunction: cluster => L.divIcon({ 
          html: `<div>${cluster.getChildCount()}</div>`, 
          className: 'cluster-marcadores', 
          iconSize: [40,40] 
        }),
        maxClusterRadius: 50,
        spiderfyOnMaxZoom: true,
        zoomToBoundsOnClick: true
      }); 
      
      let icono = L.divIcon({ 
        className: 'negocio-marker', 
        html: '⚡', 
        iconSize: [32,32], 
        popupAnchor: [0,-16] 
      }); 
      
      verifiedBusinesses.forEach(business => { 
        let popup = generarPopupHTML(business); 
        let marker = L.marker(business.latlng, { icon: icono }).bindPopup(popup, { maxWidth: 380, className: 'custom-popup' }); 
        marker.datosNegocio = business; 
        marker.datosBusqueda = `${business.name} ${business.category} ${business.description}`.toLowerCase(); 
        marcadoresOriginales.push(marker); 
        clusters.addLayer(marker); 
      }); 
      mapa.addLayer(clusters); 
      
      mapa.osmLayer = osmLayer;
    }
    
    function centrarMapaRapido() {
      if (navigator.geolocation) {
        const btn = document.getElementById('centrar-btn');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>LOCATING...</span>';
        navigator.geolocation.getCurrentPosition(
          pos => { 
            const { latitude, longitude } = pos.coords; 
            if (userMarker) mapa.removeLayer(userMarker); 
            userMarker = L.marker([latitude, longitude], { 
              icon: L.divIcon({ 
                className: 'user-location-marker', 
                html: '📍', 
                iconSize: [28, 28] 
              }) 
            }).addTo(mapa).bindPopup('Your current location'); 
            mapa.setView([latitude, longitude], 16); 
            btn.innerHTML = '<i class="fas fa-location-dot"></i><span>CENTER</span>'; 
          },
          err => { 
            btn.innerHTML = '<i class="fas fa-location-dot"></i><span>CENTER</span>'; 
            mapa.setView([20, 0], 2); 
            alert('Could not get your location. Showing global view.'); 
          }
        );
      } else { mapa.setView([20, 0], 2); }
    }
    
    document.addEventListener('DOMContentLoaded', () => { 
      initMap(); 
      
      document.getElementById('centrar-btn').addEventListener('click', centrarMapaRapido);
      
      // BÚSQUEDA
      let inputBuscar = document.getElementById('buscador'); 
      let buscadorTimeout;
      inputBuscar.addEventListener('input', (e) => { 
        clearTimeout(buscadorTimeout); 
        let term = e.target.value.trim(); 
        let sugDiv = document.getElementById('sugerencias-busqueda'); 
        if(term.length < 2) { sugDiv.style.display = 'none'; return; } 
        sugDiv.innerHTML = `<div class="sugerencia-item">🔍 Searching...</div>`; 
        sugDiv.style.display = 'block'; 
        buscadorTimeout = setTimeout(() => { 
          let resultados = marcadoresOriginales.filter(m => m.datosBusqueda.includes(term.toLowerCase())); 
          sugDiv.innerHTML = ''; 
          resultados.forEach(m => { 
            let name = m.datosNegocio.name; 
            let item = document.createElement('div'); 
            item.className = 'sugerencia-item'; 
            item.innerHTML = `<div class="sugerencia-texto"><strong>⚡ ${name}</strong></div><button class="sugerencia-boton">View</button>`; 
            item.querySelector('.sugerencia-boton').addEventListener('click', () => { 
              m.openPopup(); 
              mapa.setView(m.getLatLng(), 16); 
              sugDiv.style.display = 'none'; 
            }); 
            sugDiv.appendChild(item); 
          }); 
          if(resultados.length===0) sugDiv.innerHTML = `<div class="sugerencia-item">❌ No results found worldwide</div>`; 
        }, 300); 
      }); 
      
      document.addEventListener('click', (e) => { 
        if(!e.target.closest('.contenedor-buscador')) 
          document.getElementById('sugerencias-busqueda').style.display = 'none'; 
      });
    });
  </script>
